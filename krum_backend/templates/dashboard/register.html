<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Store — Krum Store System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-primary: #1F8396;
            --color-primary-dark: #13525E;
            --color-primary-deep: #0D373F;
            --color-primary-light: #E6F5F8;
            --color-primary-border: #BCE5ED;
            --color-gold: #D7A928;
            --bg-canvas: #F4F8FA;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #64748B;
            --danger: #EF4444;
            --danger-light: #FEE2E2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(31, 131, 150, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(215, 169, 40, 0.08) 0%, transparent 40%);
        }

        .register-card {
            background: #FFFFFF;
            border: 1px solid var(--color-primary-border);
            border-radius: 20px;
            width: 100%;
            max-width: 520px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(19, 82, 94, 0.08);
            position: relative;
        }

        .register-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--color-primary) 0%, var(--color-gold) 100%);
            border-radius: 20px 20px 0 0;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            width: 50px;
            height: 50px;
            background: var(--color-primary);
            color: #FFFFFF;
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 800;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--color-primary-border);
            box-shadow: 0 4px 14px rgba(31, 131, 150, 0.3);
            margin-bottom: 12px;
        }

        .brand-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: var(--color-primary-dark);
            margin-bottom: 4px;
        }

        .brand-header p {
            font-size: 13.5px;
            color: var(--text-muted);
        }

        .error-alert {
            background: var(--danger-light);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #991B1B;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        @media (max-width: 540px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--color-primary-border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #FFFFFF;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(31, 131, 150, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--color-primary);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(31, 131, 150, 0.3);
            transition: all 0.2s;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background: var(--color-primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(31, 131, 150, 0.4);
        }

        .card-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--color-primary-light);
            font-size: 13px;
            color: var(--text-muted);
        }

        .card-footer a {
            color: var(--color-primary);
            font-weight: 700;
            text-decoration: none;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="brand-header">
            <div class="brand-logo">K</div>
            <h1>Create Your Store</h1>
            <p>Setup your supermarket or provision store with Krum OS</p>
        </div>

        {% if error %}
        <div class="error-alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="business_name">Store / Business Name *</label>
                <input type="text" id="business_name" name="business_name" required autofocus placeholder="e.g. Sunrise Supermarket & Provisions" value="{{ form.business_name }}">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="currency">Currency</label>
                    <select id="currency" name="currency">
                        <option value="NGN" {% if form.currency == 'NGN' %}selected{% endif %}>₦ Nigerian Naira (NGN)</option>
                        <option value="USD" {% if form.currency == 'USD' %}selected{% endif %}>$ US Dollar (USD)</option>
                        <option value="GHS" {% if form.currency == 'GHS' %}selected{% endif %}>GH₵ Ghanaian Cedi (GHS)</option>
                        <option value="KES" {% if form.currency == 'KES' %}selected{% endif %}>KSh Kenyan Shilling (KES)</option>
                        <option value="GBP" {% if form.currency == 'GBP' %}selected{% endif %}>£ British Pound (GBP)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="phone">Store Phone</label>
                    <input type="tel" id="phone" name="phone" placeholder="e.g. 08012345678" value="{{ form.phone }}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="username">Owner Username *</label>
                    <input type="text" id="username" name="username" required placeholder="e.g. storeowner" value="{{ form.username }}">
                </div>

                <div class="form-group">
                    <label for="email">Owner Email</label>
                    <input type="email" id="email" name="email" placeholder="owner@store.com" value="{{ form.email }}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password (min 8 chars) *</label>
                    <input type="password" id="password" name="password" required placeholder="Minimum 8 characters">
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password *</label>
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-enter password">
                </div>
            </div>

            <button type="submit" class="submit-btn">
                Create Store & Access Dashboard →
            </button>
        </form>

        <div class="card-footer">
            <p style="margin-bottom: 8px;">
                Already have a store account? 
                <a href="/dashboard/login/">Sign In to Dashboard →</a>
            </p>
            <a href="/">← Return to Krum Homepage</a>
        </div>
    </div>

</body>
</html>
