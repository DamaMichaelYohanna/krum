<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Portal Login — Krum Store System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-primary: #1F8396;
            --color-primary-dark: #13525E;
            --color-primary-deep: #0D373F;
            --color-primary-light: #E6F5F8;
            --color-primary-border: #BCE5ED;
            --color-gold: #D7A928;
            --bg-canvas: #F4F8FA;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #64748B;
            --danger: #EF4444;
            --danger-light: #FEE2E2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(31, 131, 150, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(215, 169, 40, 0.08) 0%, transparent 40%);
        }

        .login-card {
            background: #FFFFFF;
            border: 1px solid var(--color-primary-border);
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(19, 82, 94, 0.08);
            position: relative;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--color-primary) 0%, var(--color-gold) 100%);
            border-radius: 20px 20px 0 0;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            width: 50px;
            height: 50px;
            background: var(--color-primary);
            color: #FFFFFF;
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 800;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--color-primary-border);
            box-shadow: 0 4px 14px rgba(31, 131, 150, 0.3);
            margin-bottom: 12px;
        }

        .brand-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: var(--color-primary-dark);
            margin-bottom: 4px;
        }

        .brand-header p {
            font-size: 13.5px;
            color: var(--text-muted);
        }

        .error-alert {
            background: var(--danger-light);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #991B1B;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--color-primary-border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(31, 131, 150, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: var(--color-primary);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(31, 131, 150, 0.3);
            transition: all 0.2s;
        }

        .submit-btn:hover {
            background: var(--color-primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(31, 131, 150, 0.4);
        }

        .card-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--color-primary-light);
            font-size: 13px;
            color: var(--text-muted);
        }

        .card-footer a {
            color: var(--color-primary);
            font-weight: 700;
            text-decoration: none;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <div class="brand-logo">K</div>
            <h1>Store Admin Portal</h1>
            <p>Sign in to manage your store, inventory, and till audits</p>
        </div>

        {% if error %}
        <div class="error-alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next_url }}">

            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" required autofocus placeholder="e.g. manager or owner">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter password">
            </div>

            <button type="submit" class="submit-btn">
                Sign In to Dashboard
            </button>
        </form>

        <div class="card-footer">
            <p style="margin-bottom: 8px;">
                New store owner? 
                <a href="/dashboard/register/">Register Your Store →</a>
            </p>
            <a href="/">← Return to Krum Homepage</a>
        </div>
    </div>

</body>
</html>
